services:
  ghost:
    image: ghost:5.130.6-alpine
    restart: unless-stopped
    environment:
      url: ${GHOST_URL}
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      database__useNullAsDefault: "true"
      NODE_ENV: production
    volumes:
      - ./content:/var/lib/ghost/content
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.blog.rule=Host(`${BLOG_HOST}`)"
      - "traefik.http.routers.blog.entrypoints=websecure"
      - "traefik.http.routers.blog.tls.certresolver=letsencrypt"
      - "traefik.http.routers.blog.middlewares=security-headers@file"
      - "traefik.http.services.blog.loadbalancer.server.port=2368"
    healthcheck:
      # Ghost redirige tout en 301 (url https) ; on considère sain toute réponse < 500.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:2368/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 512m

networks:
  web:
    external: true
